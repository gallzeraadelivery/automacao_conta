name: uber-automation

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uber_automation}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-strong-password}
      POSTGRES_DB: ${POSTGRES_DB:-uber_automation}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uber_automation}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uber_automation}:${POSTGRES_PASSWORD:-change-me-strong-password}@postgres:5432/${POSTGRES_DB:-uber_automation}
      REDIS_URL: redis://redis:6379
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      # Mesmo volume do worker — download de cookies / delete de perfil.
      BROWSER_PROFILES_STORAGE_PATH: /app/storage/browser-profiles
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - browser_profiles_data:/app/storage/browser-profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-uber_automation}:${POSTGRES_PASSWORD:-change-me-strong-password}@postgres:5432/${POSTGRES_DB:-uber_automation}
      REDIS_URL: redis://redis:6379
      # Persiste cookies/sessão isolados por motorista entre restarts do
      # container (ver volume browser_profiles_data abaixo e
      # @uber-automation/automation BrowserProfileManager).
      BROWSER_PROFILES_STORAGE_PATH: /app/storage/browser-profiles
      # Headed via xvfb. Em Linux aarch64 (Docker Desktop Mac) o canal
      # `chrome` NÃO existe — usamos chromium headed (mesmo build 151).
      # Em linux/amd64 pode trocar para chrome (Chrome for Testing).
      AUTOMATION_HEADLESS: "false"
      PLAYWRIGHT_BROWSER_CHANNEL: chromium
      AUTOMATION_BROWSER_ENGINE: electron
      # AUTOMATION_TARGET=mock (padrão, ver .env.example) mira aqui, no
      # serviço mock-server dentro da rede Docker - nunca na Uber real. O
      # mock-server só sobe com `docker compose --profile dev up`; sem ele,
      # jobs RUN_ADMINISTRATIVE_FLOW falham com erro técnico (retryable) até
      # subir. Trocar AUTOMATION_TARGET para "production" também precisa
      # trocar este valor (ou removê-lo) - ver SECURITY.md antes de fazer isso.
      MOCK_UBER_BASE_URL: http://mock-server:3001/mock-uber
      # Screenshot automático em pausas/erros da automação (nunca em
      # sucesso) - ver captureDebugScreenshot em uberAutomationRunner.ts.
      # Bind mount (não volume nomeado) de propósito: dá pra abrir os PNGs
      # direto em ./storage/automation-screenshots na sua máquina, sem
      # precisar de `docker cp`.
      AUTOMATION_SCREENSHOTS_PATH: /app/storage/automation-screenshots
    ports:
      # noVNC: abra http://localhost:6080/vnc.html para ver o Electron headed
      - "6080:6080"
    volumes:
      - browser_profiles_data:/app/storage/browser-profiles
      - ../../storage/automation-screenshots:/app/storage/automation-screenshots
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      # NEXT_PUBLIC_API_URL precisa ser um build arg (não `environment:`
      # abaixo) - o Next.js embute variáveis NEXT_PUBLIC_* no bundle do
      # cliente em tempo de build (`next build`), não de execução. Mudar
      # `.env` sem rebuildar a imagem não tem efeito nela - ver Dockerfile.web.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

  # Simulador local do fluxo de cadastro da Uber (Fase 3) - nunca deve rodar
  # em produção. Só sobe com `docker compose --profile dev up`, nunca com um
  # `docker compose up` simples (sem --profile).
  mock-server:
    profiles: ["dev"]
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mock-server
    restart: unless-stopped
    env_file:
      - ../../.env
    ports:
      - "${MOCK_SERVER_PORT:-3001}:3001"

volumes:
  postgres_data:
  redis_data:
  browser_profiles_data:
